<!--A. Binding de texto — sin prefijo:
Quieres mostrar un dato dentro del contenido visual de una etiqueta. -->
html`<p>Hola, ${this.nombre}</p>`

<!--this.nombre = "Lit"
        │
        ▼
<p>Hola, ${this.nombre}</p>
        │
        ▼
<p>Hola, Lit</p>-->
<!--Básico-->
<p>ClimaVivo</p>
<!--Intermedio-->
<p>Ciudad: ${this.ciudad}</p>

<!--Reto-->
  <h2>${this.ciudad}</h2>
  <p>${this.temperatura} °C</p>
  <p>${this.condicion}</p>

  <!--B. Binding de atributo — sin prefijo dentro de un atributo
  Quieres poner un valor dinámico en un atributo HTML.
  Por ejemplo, un texto de ayuda title:-->
  <button title="${this.mensaje}">Consultar</button>
  <!-- Si js: this.mensaje = 'Consulta el clima de la ciudad escrita';-->
<button title="Consulta el clima de la ciudad escrita">
  Consultar
</button>

<!--Básico-->
<img alt="${this.nombre}">

<!--Intermedio-->
<button title="Guardar ${this.ciudad}">☆ Guardar ciudad</button>

<!--Reto-->

  <img
    src="${this.icono}"
    alt="Condición actual: ${this.condicion}"
  >

  <!-- C. Para Blindings booleanos usar: ?-->

  <!--Básico-->
  html`<button ?disabled="${true}">Enviar</button>`

  <!--intermedio-->
<input ?readonly="${this.soloLectura}">`
  
<!--ClimaVivo
Si el dashboard está cargando:
→ deshabilitar temporalmente Consultar.-->
html`
  <button ?disabled="${this.cargando}">
    Consultar
  </button>
`

<!--D. Blingind de propiedad-->

  <!--Básico-->
  html`<input .value="${this.texto}">`
  
  <!--Intermedio-->
  html`<input .placeholder="${this.pista}">`

  <!--Reto-->
  html`<city-search .ciudad="${this.ciudadActual}"></city-search>`

  <!--E. Binding de evento — prefijo @
  Problema
Quieres que una interacción del usuario llame a una función.
Usuario hace clic
      │
      ▼
El componente ejecuta una acción-->

<button @click="${this.saludar}">Saludar</button>

<!--@click
→ conecta el evento click de un elemento con una función del componente.
Básicamente es un oido amigox, similar a addEventListener en js (no es lo mismo pero c parecen en funcionalidad jeje)-->
